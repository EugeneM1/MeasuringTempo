name: Daily market snapshot

# Records the top markets by 24h volume on Kalshi and Polymarket once a day
# and commits the CSV to snapshots/. See tempo/snapshot.py.

on:
  schedule:
    - cron: "17 20 * * *"   # 20:17 UTC = 12:17pm Pacific (1:17pm in summer)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to push the snapshot commit

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx==0.28.1

      - name: Take snapshot
        run: python -m tempo.snapshot

      - name: Commit and push
        run: |
          # Committed under the repo owner's GitHub identity: this is his
          # pipeline running on his schedule.
          git config user.name "EugeneM1"
          git config user.email "107156907+EugeneM1@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git commit -m "data: market snapshot $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
