# Local/VPS deployment: the collector plus Postgres.
# Start: docker compose up -d        Logs: docker compose logs -f collector
services:
  collector:
    build: .
    env_file: .env
    environment:
      # Key file is mounted below; this overrides the laptop path in .env.
      KALSHI_KEY_PATH: /keys/kalshi.pem
    volumes:
      - ./data:/app/data                      # raw JSONL survives the container
      - ${KALSHI_KEY_DIR:-~/.kalshi}:/keys:ro # private key, read-only
    restart: unless-stopped                    # survives crashes AND reboots

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tempo-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"                 # localhost only, never the internet

volumes:
  pgdata:
